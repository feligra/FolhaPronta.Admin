# ============================================================
# FolhaPronta Admin — Deploy Automatizado
# ============================================================
# Trigger: push na branch 'release'
# Build: React+Vite → Nginx → Docker image → GHCR
# Deploy: SSH na VPS → pull → restart container do Admin
#
# Resiliência: o SSH na VPS tenta até 3× com 30s entre tentativas.
# ============================================================

name: Deploy Admin

on:
  push:
    branches:
      - release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/feligra/folhapronta-admin

jobs:
  build-and-push:
    name: Build e Push da imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configurar chave SSH e known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Atualizar container Admin na VPS (com retry)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # Script de deploy escrito localmente (no runner ephemeral). Sem
          # secrets — só comandos de pull + restart, então não precisa de
          # substituição. Enviamos via stdin pro bash remoto.
          cat > /tmp/deploy.sh << 'DEPLOY_EOF'
          set -e
          cd /opt/folhapronta
          echo "📦 Baixando imagem nova do Admin..."
          docker pull ghcr.io/feligra/folhapronta-admin:latest
          # --force-recreate é CRÍTICO: sem isso o compose vê o container rodando e skipa,
          # continuando a servir a imagem anterior mesmo após o pull. Esse era o motivo
          # de mudanças no frontend demorarem a aparecer em prod.
          echo "🚀 Reiniciando Admin (force-recreate pra pegar imagem nova)..."
          docker compose -f docker-compose.prod.yml up -d --force-recreate folhapronta-admin
          echo "🧹 Limpando imagens antigas..."
          docker image prune -af
          echo "✅ Admin atualizado!"
          docker compose -f docker-compose.prod.yml ps folhapronta-admin
          DEPLOY_EOF

          set +e
          for attempt in 1 2 3; do
            echo "🔄 Deploy — tentativa $attempt/3..."
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/deploy.sh
            if [ $? -eq 0 ]; then
              echo "✅ Deploy concluído na tentativa $attempt"
              rm -f /tmp/deploy.sh
              exit 0
            fi
            echo "⚠️  Tentativa $attempt falhou."
            if [ $attempt -lt 3 ]; then
              echo "   Aguardando 30s antes da próxima tentativa..."
              sleep 30
            fi
          done
          rm -f /tmp/deploy.sh
          echo "❌ 3 tentativas de SSH falharam — abortando deploy"
          exit 1
