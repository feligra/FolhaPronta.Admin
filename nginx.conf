# Nginx config pra SPA (React + Vite).
# Servido dentro do container `folhapronta-admin`.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Restrict embedding/plugins/base tags without blocking the configured API.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip pra performance — text-based assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Assets versionados pelo Vite (hashed filenames) — cache agressivo.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nginx stops inheriting add_header when a location defines its own.
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota desconhecida → index.html (react-router lida client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloqueia acesso a arquivos ocultos (.git, .env, etc).
    location ~ /\. {
        deny all;
        return 404;
    }
}
